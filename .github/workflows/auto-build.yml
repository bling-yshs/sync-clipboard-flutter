name: 🛠️ Flutter 自动构建

on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: 🛠️ 构建 Android
    runs-on: ubuntu-22.04

    steps:
      - name: 选择 Checkout 目标 (Decide repo/ref)
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "repo=${{ github.event.pull_request.head.repo.full_name }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: 检出代码 (Checkout)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pick.outputs.repo }}
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 0
          # PR 场景禁用默认 token
          persist-credentials: false

#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3
#        with:
#          detached: true

      - name: 安装 Java (Install Java)
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: 安装 Flutter (Set up Flutter)
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version-file: "pubspec.yaml"

      - name: Gradle 缓存 (Gradle cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 拉取依赖 (flutter pub get)
        run: flutter pub get

      - name: 创建签名配置 (Create signing config)
        env:
          FLUTTER_ANDROID_KEYSTORE_BASE64: ${{ secrets.FLUTTER_ANDROID_KEYSTORE_BASE64 }}
          FLUTTER_KEYSTORE_PASSWORD: ${{ secrets.FLUTTER_KEYSTORE_PASSWORD }}
          FLUTTER_KEY_ALIAS: ${{ secrets.FLUTTER_KEY_ALIAS }}
        run: |
          echo "$FLUTTER_ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/SyncClipboardAndroidKey.jks
          cat > android/key.properties << EOF
          storePassword=$FLUTTER_KEYSTORE_PASSWORD
          keyPassword=$FLUTTER_KEYSTORE_PASSWORD
          keyAlias=$FLUTTER_KEY_ALIAS
          storeFile=SyncClipboardAndroidKey.jks
          EOF

      - name: 构建 APK (Build APK)
        run: flutter build apk --release --target-platform android-arm64

      - name: 上传构建产物 (Upload build artifacts)
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          archive: false
          if-no-files-found: error

  upload-to-release-alpha:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    name: 📤 上传到 alpha 版本 (Upload to alpha release)
    needs: build-android
    runs-on: ubuntu-22.04

    steps:
      - name: 克隆仓库 (Checkout repo)
        uses: actions/checkout@v6

      - name: 下载 Artifact (Download Artifact)
        uses: actions/download-artifact@v8
        with:
          name: app-release.apk
          path: ./download

      - name: 读取 Unreleased Changelog (Read Unreleased Changelog)
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2.2.3
        with:
          version: "Unreleased"
          path: "./CHANGELOG.md"

      - name: 提取 Unreleased 对比链接 (Extract Unreleased Compare Link)
        id: changelog_link
        run: |
          URL=$(grep "\[Unreleased\]:" CHANGELOG.md | awk '{print $2}')
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: 上传编译结果到 pre-release (Upload build result to pre-release)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: alpha
          commit: ${{ github.sha }}
          body: |
            ${{ steps.changelog_reader.outputs.description || steps.changelog_reader.outputs.changes }}

            ---
            **Full Changelog**: ${{ steps.changelog_link.outputs.url }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: true
          artifacts: ./download/app-release.apk
